# Basic Nginx configuration for serving a frontend application
# This configuration serves a single-page application (SPA) using Nginx.
# It assumes that the application is built and the static files are located in /usr/share/nginx/html.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    error_page 404 /index.html;
}
