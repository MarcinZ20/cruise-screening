services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: cruise
      POSTGRES_PASSWORD: cruise
      POSTGRES_DB: cruise_literature
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./cruise_literature
      dockerfile: Dockerfile
    volumes:
      - ./cruise_literature:/app
      - ./data:/data
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend-prod:
    profiles:
      - prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  frontend-dev:
    profiles:
      - dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"  
    volumes:
      - ./frontend:/app  
      - /app/node_modules  
    environment:
      - CHOKIDAR_USEPOLLING=true 
    restart: unless-stopped

  elasticsearch:
    profiles:
      - es
    image: docker.elastic.co/elasticsearch/elasticsearch:7.13.4
    container_name: es-cruise-literature
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./data/es:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  search_app:
    profiles:
      - search
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        config_file: search_app_config.json
    image: dossier/cruise-literature-search_app:1
    restart: on-failure
    depends_on:
      - elasticsearch
    ports:
      - "9880:8880"

volumes:
  pgdata: